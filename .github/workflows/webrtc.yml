name: webrtc

on: [push, pull_request]

env:
  LIBDATACHANNEL_PREFIX: /home/runner/libdatachannel

jobs:
  # Builds with --enable-webrtc (make check runs webrtc-local.test through the
  # bridge) and without it (the default binaries must not link libdatachannel).
  build-webrtc:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: install build dependencies
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libprotobuf-dev libncurses-dev libssl-dev libutempter-dev autoconf automake pkg-config cmake

    - name: libdatachannel submodule commit
      id: libdatachannel
      run: echo "commit=$(git -C third_party/libdatachannel rev-parse HEAD)" >> "$GITHUB_OUTPUT"

    - name: cache libdatachannel
      id: cache-libdatachannel
      uses: actions/cache@v4
      with:
        path: ${{ env.LIBDATACHANNEL_PREFIX }}
        key: libdatachannel-${{ runner.os }}-${{ steps.libdatachannel.outputs.commit }}-${{ hashFiles('src/tests/webrtc-nat/build-libdatachannel.sh') }}

    - name: build libdatachannel
      if: steps.cache-libdatachannel.outputs.cache-hit != 'true'
      run: src/tests/webrtc-nat/build-libdatachannel.sh --prefix="$LIBDATACHANNEL_PREFIX"

    - name: generate build scripts
      run: ./autogen.sh

    - name: configure --enable-webrtc
      run: ./configure --enable-webrtc --enable-compile-warnings=maximum CPPFLAGS="-I$LIBDATACHANNEL_PREFIX/include" LDFLAGS="-L$LIBDATACHANNEL_PREFIX/lib -Wl,-rpath,$LIBDATACHANNEL_PREFIX/lib"

    - name: build (webrtc)
      run: make -j"$(nproc)"

    - name: test (webrtc, includes webrtc-local.test)
      run: make check

    - name: show test logs on failure
      if: failure()
      run: cat src/tests/test-suite.log

    - name: configure (default)
      run: make distclean && ./configure --enable-compile-warnings=maximum

    - name: build (default)
      run: make -j"$(nproc)"

    - name: default binaries must not link libdatachannel
      run: test "$(ldd src/frontend/mosh-server src/frontend/mosh-client | grep -c datachannel)" = 0

  # Full NAT-traversal e2e with docker compose (two NATs, STUN, real ssh).
  # The peer image is built here with a GHA registry cache because its
  # libdatachannel stage is the slow part; `make run` reuses the loaded image.
  e2e-nat:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - uses: docker/setup-buildx-action@v3

    - name: build e2e peer image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: src/tests/webrtc-nat/Dockerfile
        tags: mosh-webrtc-e2e
        load: true
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: build nat image
      run: docker compose -f src/tests/webrtc-nat/docker-compose.yml build nat_client nat_server

    - name: run e2e
      run: make -C src/tests/webrtc-nat run

    - name: tear down
      if: always()
      run: make -C src/tests/webrtc-nat down

  # Debian package (static libdatachannel) built in a clean debian:trixie
  # container, the same command as in debian/README.source.
  deb:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: build .deb in debian:trixie
      run: |
        mkdir -p out
        docker run --rm -v "$PWD":/src:ro -v "$PWD/out":/out debian:trixie sh -euc '
            apt-get update && apt-get install -y --no-install-recommends \
                build-essential devscripts equivs
            cp -a /src /build && cd /build
            mk-build-deps -i -r -t "apt-get -y --no-install-recommends" debian/control
            dpkg-buildpackage -us -uc -b
            cp ../mosh-webrtc_* /out/'

    - name: check the package
      run: |
        dpkg -I out/mosh-webrtc_*.deb
        test "$(dpkg -I out/mosh-webrtc_*.deb | grep "^ Depends:" | grep -c datachannel)" = 0

    - uses: actions/upload-artifact@v4
      with:
        name: mosh-webrtc-deb
        path: out/mosh-webrtc_*
